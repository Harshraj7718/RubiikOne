<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1219" />
    <title>RUBIIK — Precision in every dimension</title>
    <meta name="description" content="RUBIIK ONE — a limited edition of 200 pieces. Pre-booking now open with 20% off. Launching 6 November." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Paint the dark background immediately, before any CSS or JS arrives. -->
    <style>html,body{background:#0B1219}</style>
    <!-- The hero's two watches start downloading straight away. -->
    <link rel="preload" as="image" href="/images/skeleton-watch.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/olive-watch.webp" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint (display=swap shows text immediately). -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
